services:
  rms-app:
    image: rms:${RMS_IMAGE_TAG:-rms-001}
    container_name: rms-app
    env_file:
      - .env
    volumes:
      - ./uploads:/app/public/uploads
      - ./logs:/app/logs
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    external: true
    name: ${RMS_DOCKER_NETWORK:-apps_app-network}
