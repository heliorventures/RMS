<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Helior RMS</title>
  <link href="/assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body class="bg-light">
  <a class="skip-link" href="#mainContent">Skip to main content</a>
  <main class="container min-vh-100 d-flex align-items-center justify-content-center py-4" id="mainContent" tabindex="-1">
    <div class="card shadow-sm" style="max-width:460px;width:100%">
      <div class="card-body p-4">
        <h1 class="h3 mb-2">Reset your password</h1>
        <p class="text-secondary">Use at least 12 characters. This reset link can be used once.</p>
        <form id="resetPasswordForm">
          <div class="mb-3">
            <label class="form-label" for="newPassword">New password</label>
            <input class="form-control" type="password" id="newPassword" name="newPassword" autocomplete="new-password" required minlength="12">
          </div>
          <div class="mb-3">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required minlength="12">
          </div>
          <div class="alert py-2 small d-none" id="resetStatus"></div>
          <button class="btn btn-primary w-100" type="submit" id="resetPasswordBtn">Reset Password</button>
        </form>
        <a class="d-block text-center mt-3" href="/index.html">Back to sign in</a>
      </div>
    </div>
  </main>
  <script src="/assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/mutations.js"></script>
  <script src="/assets/js/pages/reset-password.js"></script>
</body>
</html>
